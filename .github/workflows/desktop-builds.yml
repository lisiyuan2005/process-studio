name: Desktop builds

on:
  workflow_dispatch:
    # A manual run can be narrowed to one platform: a Windows build for a
    # machine whose antivirus eats a worker is one job, not two. A tag
    # builds both.
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options: [all, windows, macos]
      release:
        description: Also publish a GitHub release under this tag (e.g. v0.2.0); needs both platforms
        type: string
        default: ""
  push:
    tags:
      - "v*"

# The Tauri shell is the desktop application; the artifacts are the
# executable and the .app, with no installer or disk image. A tag also
# publishes a GitHub release carrying both, which is what the application's
# "Check for updates" reads.
permissions:
  contents: write

# One build per platform. There is one kernel, so there is one edition.
jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    env:
      ARTIFACT: ProcessStudio-Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Run the kernel and worker tests
        shell: pwsh
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        shell: pwsh
        run: ./scripts/build_desktop.ps1

      # The executable resolves its worker under <exe dir>/resources, so the
      # folder build carries that directory next to the binary (the in-app
      # updater installs from it). The installer is one file holding both.
      - name: Collect the application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/ProcessStudio | Out-Null
          $Exe = "desktop/src-tauri/target/release/ProcessStudio.exe"
          if (-not (Test-Path $Exe)) { $Exe = "desktop/src-tauri/target/release/process-studio-desktop.exe" }
          Copy-Item $Exe release/ProcessStudio/ProcessStudio.exe
          Copy-Item desktop/src-tauri/resources release/ProcessStudio/resources -Recurse
          New-Item -ItemType Directory -Force -Path release/setup | Out-Null
          $Setup = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis -Filter "*-setup.exe" | Select-Object -First 1
          Copy-Item $Setup.FullName release/setup/ProcessStudio-Setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: release/ProcessStudio
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessStudio-Windows-Setup
          path: release/setup/ProcessStudio-Setup.exe
          if-no-files-found: error

  macos:
    # Pinned to the image the emulator builds on. A newer runner means a newer
    # SDK and a different linker signature, and that app opens where this one
    # did not.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-14
    env:
      PRODUCT: Process Studio
      ARTIFACT: ProcessStudio-macOS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Run the kernel and worker tests
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        run: bash scripts/build_desktop.sh

      # The linker's own signature covers the executable only. Without a bundle
      # signature there is no _CodeSignature/CodeResources, the Info.plist is
      # unbound, and the kernel kills the process on launch. Fail the build here
      # rather than shipping an app that cannot start.
      - name: Verify the bundle signature
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/${{ env.PRODUCT }}.app"
          test -f "$APP/Contents/_CodeSignature/CodeResources" \
            || { echo "the bundle has no sealed resources"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Signature|flags|Info.plist"
          codesign --verify --strict --verbose=2 "$APP"

      # A .app is a directory, so it is zipped once here; GitHub would
      # otherwise flatten it and lose the executable bit.
      - name: Collect the application
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "desktop/src-tauri/target/release/bundle/macos/${{ env.PRODUCT }}.app" \
            "release/${{ env.ARTIFACT }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            release/${{ env.ARTIFACT }}.zip
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    # Both platforms go into one release under the tag, named the way the
    # worker's update check expects (see worker/update.py).
    # A manual run names the tag in `release`; the release action creates
    # the tag at this commit when it does not exist yet.
    if: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.release != '' }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip the Windows build
        run: |
          set -e
          mkdir -p release
          if [ -d "artifacts/ProcessStudio-Windows" ]; then
            (cd artifacts/ProcessStudio-Windows && zip -qr ../../release/ProcessStudio-Windows.zip .)
          fi
          if [ -d "artifacts/ProcessStudio-Windows-Setup" ]; then
            cp artifacts/ProcessStudio-Windows-Setup/ProcessStudio-Setup.exe release/
          fi
          if [ -d "artifacts/ProcessStudio-macOS" ]; then
            find artifacts/ProcessStudio-macOS \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} release/ \;
          fi
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release || github.ref_name }}
          target_commitish: ${{ github.sha }}
          files: release/*
          generate_release_notes: true
