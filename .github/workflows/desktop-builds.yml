name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# The Tauri shell is the desktop application; the artifacts are the
# executable and the .app, with no installer or disk image.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Run the kernel and worker tests
        shell: pwsh
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        shell: pwsh
        run: ./scripts/build_desktop.ps1

      # The executable resolves its worker under <exe dir>/resources, so the
      # artifact carries that directory next to the binary.
      - name: Collect the application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/ProcessStudio | Out-Null
          Copy-Item desktop/src-tauri/target/release/process-studio-desktop.exe release/ProcessStudio/ProcessStudio.exe
          Copy-Item desktop/src-tauri/resources release/ProcessStudio/resources -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessStudio-Windows
          path: release/ProcessStudio
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Run the kernel and worker tests
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        run: bash scripts/build_desktop.sh

      # A .app is a directory, so it is zipped once here; GitHub would
      # otherwise flatten it and lose the executable bit.
      - name: Collect the application
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "desktop/src-tauri/target/release/bundle/macos/Process Studio.app" \
            release/ProcessStudio-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessStudio-macOS
          path: release/ProcessStudio-macOS.zip
          if-no-files-found: error
