name: Desktop builds

on:
  workflow_dispatch:
    # A manual run can be narrowed to one platform and one edition: a
    # Windows build for a machine whose antivirus eats PyInstaller output is
    # one job, not six. A tag builds everything.
    inputs:
      platforms:
        description: Which platforms to build
        type: choice
        default: all
        options: [all, windows, macos]
      variants:
        description: Which edition to build
        type: choice
        default: all
        options: [all, full, slab, levelset]
  push:
    tags:
      - "v*"

# The Tauri shell is the desktop application; the artifacts are the
# executable and the .app, with no installer or disk image. A tag also
# publishes a GitHub release carrying every edition, which is what the
# application's "Check for updates" reads.
permissions:
  contents: write

# Three builds of each: both kernels, the slab kernel alone, the level-set
# kernel alone. A single-kernel build offers no kernel choice and refuses a
# project made with the other one.
jobs:
  windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'windows' }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.variants == 'all') && '["full","slab","levelset"]' || format('["{0}"]', inputs.variants)) }}
    env:
      KERNELS: ${{ matrix.variant == 'full' && 'levelset,slab' || matrix.variant }}
      ARTIFACT: ${{ matrix.variant == 'full' && 'ProcessStudio-Windows' || matrix.variant == 'slab' && 'ProcessStudio-Slab-Windows' || 'ProcessStudio-LevelSet-Windows' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Run the kernel and worker tests
        shell: pwsh
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        shell: pwsh
        env:
          PROCESS_STUDIO_KERNELS: ${{ env.KERNELS }}
        run: ./scripts/build_desktop.ps1

      # The executable resolves its worker under <exe dir>/resources, so the
      # artifact carries that directory next to the binary.
      - name: Collect the application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/ProcessStudio | Out-Null
          Copy-Item desktop/src-tauri/target/release/process-studio-desktop.exe release/ProcessStudio/ProcessStudio.exe
          Copy-Item desktop/src-tauri/resources release/ProcessStudio/resources -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: release/ProcessStudio
          if-no-files-found: error

  macos:
    # Pinned to the image the emulator builds on. A newer runner means a newer
    # SDK and a different linker signature, and that app opens where this one
    # did not.
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.platforms == 'all' || inputs.platforms == 'macos' }}
    runs-on: macos-14
    strategy:
      fail-fast: false
      matrix:
        variant: ${{ fromJSON((github.event_name != 'workflow_dispatch' || inputs.variants == 'all') && '["full","slab","levelset"]' || format('["{0}"]', inputs.variants)) }}
    env:
      KERNELS: ${{ matrix.variant == 'full' && 'levelset,slab' || matrix.variant }}
      PRODUCT: ${{ matrix.variant == 'full' && 'Process Studio' || matrix.variant == 'slab' && 'Process Studio Slab' || 'Process Studio Level Set' }}
      ARTIFACT: ${{ matrix.variant == 'full' && 'ProcessStudio-macOS' || matrix.variant == 'slab' && 'ProcessStudio-Slab-macOS' || 'ProcessStudio-LevelSet-macOS' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Run the kernel and worker tests
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        env:
          PROCESS_STUDIO_KERNELS: ${{ env.KERNELS }}
        run: bash scripts/build_desktop.sh

      # The linker's own signature covers the executable only. Without a bundle
      # signature there is no _CodeSignature/CodeResources, the Info.plist is
      # unbound, and the kernel kills the process on launch. Fail the build here
      # rather than shipping an app that cannot start.
      - name: Verify the bundle signature
        run: |
          APP="desktop/src-tauri/target/release/bundle/macos/${{ env.PRODUCT }}.app"
          test -f "$APP/Contents/_CodeSignature/CodeResources" \
            || { echo "the bundle has no sealed resources"; exit 1; }
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -E "Signature|flags|Info.plist"
          codesign --verify --strict --verbose=2 "$APP"

      # A .app is a directory, so it is zipped once here; GitHub would
      # otherwise flatten it and lose the executable bit.
      - name: Collect the application
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "desktop/src-tauri/target/release/bundle/macos/${{ env.PRODUCT }}.app" \
            "release/${{ env.ARTIFACT }}.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT }}
          path: |
            release/${{ env.ARTIFACT }}.zip
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error

  publish:
    # Every edition of both platforms goes into one release under the tag,
    # named the way the worker's update check expects (see worker/update.py).
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    needs: [windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Zip the Windows editions
        run: |
          set -e
          mkdir -p release
          for edition in ProcessStudio-Windows ProcessStudio-Slab-Windows ProcessStudio-LevelSet-Windows; do
            if [ -d "artifacts/$edition" ]; then
              (cd "artifacts/$edition" && zip -qr "../../release/$edition.zip" .)
            fi
          done
          for edition in ProcessStudio-macOS ProcessStudio-Slab-macOS ProcessStudio-LevelSet-macOS; do
            if [ -d "artifacts/$edition" ]; then
              find "artifacts/$edition" \( -name '*.zip' -o -name '*.dmg' \) -exec cp {} release/ \;
            fi
          done
          ls -l release

      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
