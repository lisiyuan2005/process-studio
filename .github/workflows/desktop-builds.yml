name: Desktop builds

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

# The Tauri shell is the shipping desktop application. The Tkinter EXE is no
# longer built here; scripts/build_windows.ps1 still builds it locally.
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-windows-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-windows-

      - name: Run the kernel and worker tests
        shell: pwsh
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        shell: pwsh
        run: ./scripts/build_desktop.ps1

      # The raw executable resolves its worker under <exe dir>/resources,
      # so the zip carries that directory next to the binary.
      - name: Package the portable build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release/portable | Out-Null
          Copy-Item desktop/src-tauri/target/release/process-studio-desktop.exe release/portable/ProcessStudio.exe
          Copy-Item desktop/src-tauri/resources release/portable/resources -Recurse
          Compress-Archive -Path release/portable/* -DestinationPath release/ProcessStudio-Windows-portable.zip -Force

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessStudio-Windows-installer
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessStudio-Windows-portable
          path: release/ProcessStudio-Windows-portable.zip
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: cargo-macos-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
          restore-keys: cargo-macos-

      - name: Run the kernel and worker tests
        run: |
          python -m pip install -e ".[render,test]"
          python -m pytest -q

      - name: Build the desktop shell
        run: bash scripts/build_desktop.sh

      - name: Package the app bundle
        run: |
          mkdir -p release
          ditto -c -k --sequesterRsrc --keepParent \
            "desktop/src-tauri/target/release/bundle/macos/Process Studio.app" \
            release/ProcessStudio-macOS.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ProcessStudio-macOS
          path: |
            release/ProcessStudio-macOS.zip
            desktop/src-tauri/target/release/bundle/dmg/*.dmg
          if-no-files-found: error
