[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-studio"
version = "0.9.4"
description = "3D semiconductor process-flow modeling and visualization desktop prototype"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "scikit-fmm>=2025.6.23",
  "gdstk>=1.0",
  "openpyxl>=3.1",
  "pillow>=10",
  # The slab kernel: exact polygon geometry and its triangle meshes.
  "shapely>=2.1",
  "trimesh>=4.0",
  # Ear clipping for the display mesh's caps: about thirty times GEOS's
  # constrained Delaunay on a cap with a hole array, and half the time to
  # build a stack's 3D view. The mesh falls back to GEOS without it.
  "mapbox-earcut>=1.0",
  # Flow files and the File menu's YAML export.
  "pyyaml>=6",
]

[project.scripts]
process-studio-worker = "process_studio.worker.run_worker:main"
process-studio = "process_studio.cli:main"

[project.optional-dependencies]
test = ["pytest>=8"]
render = ["scikit-image>=0.25"]
# Kept for older install commands; pyyaml is a core dependency now.
yaml = ["pyyaml>=6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
