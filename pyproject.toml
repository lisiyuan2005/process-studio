[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "process-studio"
version = "0.5.0"
description = "3D semiconductor process-flow modeling and visualization desktop prototype"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "scipy>=1.14",
  "matplotlib>=3.8",
  "gdstk>=1.0",
  "openpyxl>=3.1",
  "pillow>=10",
]

[project.scripts]
process-studio = "process_studio.ui.app:main"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--basetemp=.pytest-tmp"
